PACKAGE_NAME="macbook91-facetimehd"
PACKAGE_VERSION="@PKGVER@"

# Own module name; upstream facetimehd binds the same PCI ID, so the
# PKGBUILD declares conflicts with facetimehd-dkms(-git).
BUILT_MODULE_NAME[0]="macbook91-facetimehd"
DEST_MODULE_LOCATION[0]="/updates"

# The Makefile picks LLVM=1 or GCC from the target kernel's own .config.
# PKGVER goes into the module version together with a hash of the sources.
MAKE[0]="make KVERSION=${kernelver} KDIR=/lib/modules/${kernelver}/build PKGVER=${PACKAGE_VERSION}"

AUTOINSTALL="yes"

# No module blacklist: bdc_pci is not built in CachyOS kernels. dkms 3
# deprecates MODULES_CONF and CLEAN; it builds in a fresh copy of the source.
